<!DOCTYPE html>
<html>
<head>
    <title>My Todo List</title>

    <style>
        body {
            font-family: Arial;
            background: #e8f0fe;
            text-align: center;
            margin-top: 60px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #aaa;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 65%;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f2f2f2;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        li button {
            background: red;
        }

        li button:hover {
            background: darkred;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <input type="text" id="input" placeholder="Enter your task">

        <button onclick="add()">Add</button>

        <ul id="list-container">
        </ul>

    </div>

    <script>

        var ul = document.getElementById("list-container");
        var input = document.getElementById("input");

        function add() {

            if (input.value.trim() === "") {
                alert("Please enter a task!");
                return;
            }

            var listitem = document.createElement("li");

            listitem.innerHTML =
                input.value +
                "<button onclick='deleteitem(event)'>Delete</button>";

            ul.append(listitem);

            input.value = "";
        }

        function deleteitem(event) {
            event.target.parentElement.remove();
        }

    </script>

</body>
</html>
